[package]
name = "hot_lang"
version.workspace = true
edition.workspace = true
description = "The Hot language without its runtime: lexer, parser, AST, diagnostics, type checker, bytecode compiler and project checks"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = ["embed-std"]
# Carry hot-std's sources from this commit (see `lang::hot_std`).
embed-std = []
# Download packages from the package CDN when they aren't cached yet.
fetch = ["dep:ureq", "dep:flate2", "dep:tar", "dep:fd-lock"]

[dependencies]
ahash = { workspace = true }
ariadne = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
english-to-cron = { workspace = true }
fastnum = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
postcard = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
tracing = { workspace = true }

# `fetch`
fd-lock = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

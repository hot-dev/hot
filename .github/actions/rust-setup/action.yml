name: "Rust setup with cache, sccache, and Tailwind"
description: "Installs Rust toolchain, enables rust-cache and sccache, and installs Tailwind CLI without npm. Works on Linux, macOS, and Windows runners."
inputs:
  rust-toolchain:
    description: "Rust toolchain version (e.g., 1.99.1)"
    required: true
  tailwind-version:
    description: "Tailwind CLI version (e.g., v4.3.3)"
    required: true
  save-cache:
    description: >-
      Whether to save caches at job end. Set to 'false' for restore-only jobs
      so per-PR cache snapshots do not churn the repo's 10 GB Actions cache
      budget.
    required: false
    default: "true"
  sccache-size:
    description: "Maximum local sccache size before compression and upload."
    required: false
    default: "1G"
  cache-rust-targets:
    description: >-
      Whether rust-cache should persist target directories. Disable when
      sccache provides the compiled-artifact cache and quota is constrained.
    required: false
    default: "true"
  ci-tuning:
    description: >-
      Apply CI-only build settings: line-tables-only debug info for dev and
      test builds, and rust-lld as the Windows linker. For test workflows;
      release builds leave it off.
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: clippy, rustfmt

    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.16.0"
        token: ${{ github.token }}

    - name: Configure sccache (local disk cache)
      shell: bash
      run: |
        # Keep the on-disk location at ~/.cache/sccache on every OS so it
        # matches the actions/cache path below. The sccache server is spawned
        # by cargo as a native process, so on Windows it needs a Windows path,
        # not the Git Bash /c/... form.
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "SCCACHE_DIR=$(cygpath -w "$HOME/.cache/sccache")" >> "$GITHUB_ENV"
        else
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
        fi
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=${{ inputs.sccache-size }}" >> "$GITHUB_ENV"
        # The server stops after 600s without a new request, even while a
        # compile is in flight. Windows builds the `hot` crate alone for
        # about that long, so the default drops its connection mid-compile.
        echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

    # Set before the cache steps: rust-cache keys on CARGO_* variables.
    - name: Apply CI build settings
      if: inputs.ci-tuning == 'true'
      shell: bash
      run: |
        # CI never attaches a debugger. Line tables keep file and line in
        # backtraces while cutting compile and link work.
        echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
        # rust-lld links the large Windows test binaries much faster than
        # MSVC link.exe.
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
        fi

    - name: Cache sccache artifacts
      if: inputs.save-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/sccache
        # Stable across source-only runs: sccache content-addresses compiler
        # inputs, so a fresh run_id key only duplicates the same dependency
        # objects and burns quota. The size is part of the key because
        # actions/cache never re-saves an existing key, so a raised size
        # would otherwise never persist.
        key: sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-${{ github.job }}-${{ inputs.sccache-size }}-${{ hashFiles('Cargo.lock', '.github/actions/rust-setup/action.yml') }}
        restore-keys: |
          sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-${{ github.job }}-
          sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-

    - name: Restore sccache artifacts (restore-only)
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/sccache
        key: sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-${{ github.job }}-${{ inputs.sccache-size }}-${{ hashFiles('Cargo.lock', '.github/actions/rust-setup/action.yml') }}
        restore-keys: |
          sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-${{ github.job }}-
          sccache-${{ runner.os }}-${{ inputs.rust-toolchain }}-

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        # Cache key based on Cargo files and toolchain
        key: ${{ inputs.rust-toolchain }}
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-targets: ${{ inputs.cache-rust-targets }}

    - name: Cache Tailwind CSS CLI
      if: inputs.save-cache == 'true'
      id: tailwind-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.local/bin/tailwindcss*
        # Keyed on the install script too, so a binary cached before a digest
        # pin changed is downloaded and verified again.
        key: tailwindcss-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tailwind-version }}-${{ hashFiles('scripts/install-tailwind.sh') }}

    - name: Restore Tailwind CSS CLI (restore-only)
      if: inputs.save-cache != 'true'
      id: tailwind-restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.local/bin/tailwindcss*
        key: tailwindcss-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tailwind-version }}-${{ hashFiles('scripts/install-tailwind.sh') }}

    - name: Install Tailwind CSS CLI
      if: >-
        steps.tailwind-cache.outputs.cache-hit != 'true' &&
        steps.tailwind-restore.outputs.cache-hit != 'true'
      shell: bash
      # Verifies the download against the SHA-256 the script pins per asset.
      run: bash "$GITHUB_WORKSPACE/scripts/install-tailwind.sh" "${{ inputs.tailwind-version }}" "$HOME/.local/bin"

    - name: Add Tailwind to PATH
      shell: bash
      run: |
        # Subsequent steps may run native (non-bash) processes, so PATH
        # entries on Windows must be Windows paths.
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
        else
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Verify Tailwind version
      shell: bash
      run: tailwindcss --version

    # fastembed's build script downloads the ONNX Runtime prebuilt into the
    # user cache directory. Keeping it means a build doesn't depend on that
    # download, and release builds restore it from main's caches. Keep the
    # paths identical to the restore step in release.yml: the cache version
    # is computed from them.
    - name: Cache ONNX Runtime download
      if: inputs.save-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/ort.pyke.io
          ~/Library/Caches/ort.pyke.io
          ~/AppData/Local/ort.pyke.io
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ort-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore ONNX Runtime download (restore-only)
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/ort.pyke.io
          ~/Library/Caches/ort.pyke.io
          ~/AppData/Local/ort.pyke.io
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: ort-${{ runner.os }}-${{ runner.arch }}-

    - name: Setup Cargo optimizations
      shell: bash
      run: |
        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml << 'EOF'
        [build]
        jobs = 4

        [net]
        retry = 2
        git-fetch-with-cli = true

        [registries.crates-io]
        index = "sparse+https://index.crates.io/"
        EOF

{% extends "private_layout.html" %}

{% block content %}
<div class="py-6">
    <div class="max-w-3xl mx-auto">
        <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700 rounded-lg p-4 sm:p-6">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg class="h-6 w-6 text-blue-500 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m0 0a2 2 0 012 2v6a2 2 0 01-2 2H7a2 2 0 01-2-2V9a2 2 0 012-2m0 0V7a2 2 0 012-2h4zm-6 6h6m-6 4h6"></path>
                    </svg>
                </div>
                <div class="ml-3 flex-1 min-w-0">
                    <h1 class="text-base sm:text-lg font-medium text-blue-900 dark:text-blue-100 mb-2">{{ heading }}</h1>
                    <p class="text-xs sm:text-sm text-blue-700 dark:text-blue-300 mb-3 sm:mb-4">{{ note }}</p>
                    <div class="bg-white dark:bg-gray-800 border border-blue-300 dark:border-blue-600 rounded-md p-2 sm:p-3">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                            <div class="flex-1 min-w-0 overflow-x-auto">
                                <code data-issued-secret id="issued-secret" class="text-xs sm:text-sm font-mono text-gray-900 dark:text-gray-100 break-all">{{ token }}</code>
                            </div>
                            <button type="button" id="copy-secret" class="flex-shrink-0 self-start sm:self-auto btn btn-secondary btn-sm">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4 sm:mt-6 flex justify-end">
            <a href="{{ back_url }}" class="btn btn-primary">{{ back_label }}</a>
        </div>
    </div>
</div>
<script>
document.getElementById('copy-secret').addEventListener('click', function () {
    var button = this;
    var secret = document.getElementById('issued-secret').textContent;
    var done = function () {
        button.textContent = 'Copied!';
        setTimeout(function () { button.textContent = 'Copy'; }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(secret).then(done).catch(function () {});
        return;
    }
    var area = document.createElement('textarea');
    area.value = secret;
    area.style.position = 'fixed';
    area.style.left = '-999999px';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (error) { /* the secret stays selectable */ }
    document.body.removeChild(area);
});
</script>
{% endblock %}

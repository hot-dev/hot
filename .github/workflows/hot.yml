name: hot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runs the required checks on merge-queue groups, if the main ruleset
  # enables a merge queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.99.1
  TAILWIND_VERSION: v4.3.0
  # Disable incremental in CI: it bloats target/ (which Swatinem/rust-cache
  # strips before saving anyway) and reduces sccache hit rates. CI does clean
  # builds against a shared cache, not the inner-loop edit pattern that
  # incremental is designed for.
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  SQLX_OFFLINE: 'true'
  CI: 'true'

jobs:
  browser-security:
    name: Browser Security Regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/browser-security.test.mjs
        env:
          CHROME_BIN: google-chrome

  clippy-and-checks:
    name: Clippy and Static Checks
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          ci-tuning: "true"

      # Clippy intentionally uses the workspace default feature set. Keeping it
      # aligned with the workspace test feature set avoids forcing cargo to
      # rebuild the full dependency graph between the two jobs once caches warm.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -j 4 -- -D warnings

      - name: Browser scope contract
        run: node --test scripts/test-app-scope.mjs

      - name: Checkout published AI skill mirror
        uses: actions/checkout@v5
        with:
          repository: hot-dev/hot-skills
          # Keep the second checkout outside Cargo's disposable target tree so
          # cache cleanup cannot remove it before the sync check runs.
          path: .ci/hot-skills-mirror
          persist-credentials: false

      - name: Verify AGENTS.md sync
        run: bash ./scripts/check-agents-sync.sh

      - name: Verify AI skill assets sync
        run: bash ./scripts/check-ai-assets-sync.sh ./.ci/hot-skills-mirror

      # `hot-static-checks.sh check` runs the default project check, the package
      # aggregate check, `hot fmt --check` over all Hot source, validates
      # {{snippet:...}} references, and compiles bundled Hot-language skill
      # examples/tests.
      - name: Hot static checks
        run: ./scripts/hot-static-checks.sh check

      - name: sccache stats
        run: sccache --show-stats || true

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: hot
          POSTGRES_PASSWORD: hot
          POSTGRES_DB: hot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hot -d hot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          ci-tuning: "true"

      - name: Install pgvector for Postgres tests
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            bash -lc 'apt-get update && apt-get install -y postgresql-18-pgvector'

      - name: Install psql for upgrade provisioning tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Rust tests
        env:
          REDIS_URL: redis://localhost:6379
          HOT_TEST_POSTGRES_URI: postgres://hot:hot@localhost:5432/hot
          HOT_TEST_POSTGRES_RESET_SCHEMA: '1'
        run: cargo test --workspace --all-targets --locked -j 4

      - name: sccache stats
        run: sccache --show-stats || true

  hot-tests:
    name: Hot Tests
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: hot
          POSTGRES_PASSWORD: hot
          POSTGRES_DB: hot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hot -d hot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          ci-tuning: "true"

      - name: Run Hot init
        run: cargo run --locked --bin hot -- init -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Hot tests
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
        run: cargo run --locked --bin hot -- test -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Install pgvector for Postgres tests
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            bash -lc 'apt-get update && apt-get install -y postgresql-18-pgvector'

      - name: Provision restricted PostgreSQL runtime
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U hot -d hot -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hot_runtime LOGIN PASSWORD 'hot_runtime' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEDB NOCREATEROLE"
          cargo run --locked --bin hot -- db migrate -c hot.test.hot --ctx hot/ci.ctx.hot \
            --db.migration-uri=postgres://hot:hot@localhost:5432/hot
          docker exec -i "${{ job.services.postgres.id }}" psql -U hot -d hot \
            -v runtime_role=hot_runtime -v schema=hot < resources/db/postgres/provision_runtime.sql

      - name: Run Hot init (full suite, Postgres + Redis)
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: cargo run --locked --bin hot -- init -c hot.test.hot --ctx hot/ci.ctx.hot --db.migration-uri=postgres://hot:hot@localhost:5432/hot

      - name: Run Hot tests (full suite, Postgres + Redis)
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: cargo run --locked --bin hot -- test -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Postgres queue smoke init
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: cargo run --locked --bin hot -- init -c pg.redis.test.hot --ctx hot/ci.ctx.hot --profile local-dev --db.migration-uri=postgres://hot:hot@localhost:5432/hot

      - name: Run Postgres queue smoke tests
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: cargo run --locked --bin hot -- test -c pg.redis.test.hot --ctx hot/ci.ctx.hot --profile local-dev

      - name: Run Hot Box tests (Docker integration)
        env:
          HOT_BOX_ENABLED: true
        run: cargo run --locked --bin hot -- test box -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Hot Box tests (full suite, Postgres + Redis)
        env:
          HOT_BOX_ENABLED: true
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: cargo run --locked --bin hot -- test box -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: sccache stats
        run: sccache --show-stats || true

  kata-check:
    name: Kata Backend Compile Check
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          ci-tuning: "true"

      - name: Install protobuf compiler (for containerd-client)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `cargo test --no-run --features kata` is a superset of `cargo check`.
      # It is a Linux-only feature compile check.
      - name: Compile Kata backend (Linux feature check)
        run: cargo test -p hot_task_worker --features kata --locked --no-run

      - name: sccache stats
        run: sccache --show-stats || true

  lint-and-test:
    name: Lint, Rust Tests, and Hot Tests
    runs-on: ubuntu-24.04
    needs: [clippy-and-checks, rust-tests, hot-tests, kata-check]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check split job results
        run: |
          failed=0
          for result in \
            "${{ needs.clippy-and-checks.result }}" \
            "${{ needs.rust-tests.result }}" \
            "${{ needs.hot-tests.result }}" \
            "${{ needs.kata-check.result }}"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more split CI jobs failed."
            exit 1
          fi

          echo "All split CI jobs passed."


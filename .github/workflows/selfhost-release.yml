name: selfhost-release

# Reusable: deploy a Hot release to a self-host installation. It verifies the
# release manifest's signature with the host agent's own check (render.py's
# RELEASE_SIGNER: Hot's release workflow on a vX.Y.Z tag; a fork that
# publishes its own releases changes it there, and also changes repository:
# and the default manifest URL in its copies of the reusable workflows, as
# infra/README.md lists), writes the installation's release pointer, asks the
# host agent to deploy now, and waits for the agent's report. It uses only
# cloud control-plane APIs: no SSH, shell, or network access to the host. The
# pointer, command, and wait are infra/operator/selfhost.py, which operators
# can also run by hand.
#
#   uses: hot-dev/hot/.github/workflows/selfhost-release.yml@vX.Y.Z
on:
  workflow_call:
    inputs:
      release:
        description: Hot release to deploy, such as 3.0.1
        type: string
        required: true
      installation:
        description: Installation name
        type: string
        required: true
      cloud:
        type: string
        required: true
      environment:
        type: string
        default: production
      hot_version:
        description: Hot tag whose operator helper to use; empty means the release's own tag
        type: string
        default: ''
      manifest_base_url:
        description: Where manifests are published, with {release} for the version; empty means Hot's GitHub releases
        type: string
        default: ''
      timeout_minutes:
        description: Limit for the whole release; 0 means 30, or 60 for a scalable installation, which migrates and then rolls five roles in turn. On AWS it can be at most 240, and more than 60 needs a release role whose maximum session duration allows it, as the state bootstrap's does
        type: number
        default: 0
      preset:
        description: single-machine or scalable
        type: string
        default: single-machine
      gcp_zone:
        description: The installation's zone, required for a scalable GCP release; its scheduler runs there and its other roles in the zone's region
        type: string
        default: ''
      aws_region:
        type: string
        default: ''
      aws_release_role:
        type: string
        default: ''
      gcp_project:
        type: string
        default: ''
      gcp_workload_identity_provider:
        type: string
        default: ''
      gcp_release_service_account:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    name: Deploy ${{ inputs.release }} to ${{ inputs.installation }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes || (inputs.preset == 'scalable' && 60 || 30) }}
    concurrency:
      group: selfhost-release-${{ github.repository }}-${{ inputs.installation }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ inputs.release }}
      NAME: ${{ inputs.installation }}
    steps:
      - name: Check inputs
        id: check
        env:
          CLOUD: ${{ inputs.cloud }}
          BASE: ${{ inputs.manifest_base_url }}
          PRESET: ${{ inputs.preset }}
          ZONE: ${{ inputs.gcp_zone }}
          REGION: ${{ inputs.aws_region }}
          ROLE: ${{ inputs.aws_release_role }}
          PROJECT: ${{ inputs.gcp_project }}
          PROVIDER: ${{ inputs.gcp_workload_identity_provider }}
          SERVICE_ACCOUNT: ${{ inputs.gcp_release_service_account }}
          TIMEOUT: ${{ inputs.timeout_minutes || (inputs.preset == 'scalable' && 60 || 30) }}
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release must be a version"; exit 1; }
          [[ "$NAME" =~ ^[a-z][a-z0-9-]{2,23}$ ]] || { echo "::error::invalid installation name"; exit 1; }
          [[ "$CLOUD" =~ ^(aws|gcp)$ ]] || { echo "::error::cloud must be aws or gcp"; exit 1; }
          # The helper takes anything but scalable for a single machine.
          [[ "$PRESET" =~ ^(single-machine|scalable)$ ]] || { echo "::error::preset must be single-machine or scalable"; exit 1; }
          [[ -z "$BASE" || "$BASE" == https://* ]] || { echo "::error::manifest_base_url must use https"; exit 1; }
          [[ "$CLOUD" != gcp || "$PRESET" != scalable || "$ZONE" =~ ^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+$ ]] ||
            { echo "::error::a scalable Google Cloud release needs gcp_zone, the installation's zone, such as us-central1-a"; exit 1; }
          [[ "$CLOUD" != aws || ( -n "$REGION" && -n "$ROLE" ) ]] ||
            { echo "::error::an AWS installation needs aws_region and aws_release_role"; exit 1; }
          [[ "$CLOUD" != gcp || ( -n "$PROJECT" && -n "$PROVIDER" && -n "$SERVICE_ACCOUNT" ) ]] ||
            { echo "::error::a Google Cloud installation needs gcp_project, gcp_workload_identity_provider, and gcp_release_service_account"; exit 1; }
          [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || { echo "::error::timeout_minutes must be a whole number"; exit 1; }
          # AWS refuses a session longer than the role allows, and the state
          # bootstrap's role allows four hours.
          [[ "$CLOUD" != aws || "$TIMEOUT" -le 240 ]] ||
            { echo "::error::on AWS timeout_minutes can be at most 240, the longest session the state bootstrap's release role allows"; exit 1; }
          # Credentials last their session, whatever the job's limit. They are
          # issued after the job starts, so this outlasts the job. It stays at
          # AWS's default until the limit needs more, because a role allows an
          # hour unless it says otherwise, and AWS refuses to issue any longer.
          echo "aws_session_seconds=$(( TIMEOUT > 60 ? TIMEOUT * 60 : 3600 ))" >> "$GITHUB_OUTPUT"

      - name: Check out the operator helper and the manifest check
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: hot-dev/hot
          ref: ${{ inputs.hot_version || format('v{0}', inputs.release) }}
          path: hot
          sparse-checkout: |
            infra/operator
            infra/runtime

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # The same check the host agent makes before it deploys a release, so a
      # manifest that passes here is one the installation accepts.
      - name: Verify the release manifest
        env:
          BASE: ${{ inputs.manifest_base_url }}
        run: |
          set -euo pipefail
          default="https://github.com/hot-dev/hot/releases/download/v{release}"
          base="${BASE:-$default}"
          base="${base//\{release\}/$RELEASE}"
          curl -fsSL -o manifest.json "$base/hot-selfhost-manifest.json"
          curl -fsSL -o manifest.sigstore.json "$base/hot-selfhost-manifest.sigstore.json"
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "hot/infra/runtime")
          import render
          try:
              render.verify_manifest_signature("manifest.json", "manifest.sigstore.json")
          except ValueError as error:
              print(f"::error::{error}")
              sys.exit(1)
          EOF
          [[ "$(jq -r .release manifest.json)" == "$RELEASE" ]] || { echo "::error::manifest names another release"; exit 1; }
          jq . manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_release_role }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: ${{ steps.check.outputs.aws_session_seconds }}

      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_release_service_account }}

      - name: Release
        env:
          CLOUD: ${{ inputs.cloud }}
          REGION: ${{ inputs.aws_region }}
          PROJECT: ${{ inputs.gcp_project }}
          ZONE: ${{ inputs.gcp_zone }}
          PRESET: ${{ inputs.preset }}
          TIMEOUT: ${{ inputs.timeout_minutes || (inputs.preset == 'scalable' && 60 || 30) }}
        run: |
          set -euo pipefail
          # Unique per call: every call in a caller's run shares its run ID.
          request_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 4)"
          echo "Request ID: $request_id"
          jq -n '{installation: {name: env.NAME, cloud: env.CLOUD, region: env.REGION, project: env.PROJECT, zone: env.ZONE, preset: env.PRESET}}' > installation.json
          python3 hot/infra/operator/selfhost.py installation.json --request-id "$request_id" \
            --timeout $(( TIMEOUT * 54 )) --summary "$GITHUB_STEP_SUMMARY" release "$RELEASE"

{% extends "private_layout.html" %}

{% block content %}
<div class="py-6">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-6">
            <div class="flex flex-wrap items-center gap-2">
                <h1 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white">{{ heading }}</h1>
                <span class="badge {{ current_badge }}">{{ current_state }}</span>
            </div>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ intro }}</p>

            {% match error %}{% when Some with (message) %}
            <div class="error-box mt-4" role="alert">{{ message }}</div>
            {% when None %}{% endmatch %}

            <form method="post" action="{{ action }}" class="mt-6 space-y-4 sm:space-y-6" id="lifecycle-form">
                <fieldset>
                    <legend class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Status</legend>
                    <div class="space-y-3">
                        {% for option in options %}
                        <div class="flex items-start">
                            <input id="state-{{ option.value }}" name="state" type="radio" value="{{ option.value }}" {% if option.value == selected_state %}checked{% endif %}
                                class="mt-0.5 focus:ring-hot-red-500 h-4 w-4 text-hot-red-700 border-gray-300 dark:border-gray-600 dark:bg-gray-900">
                            <label for="state-{{ option.value }}" class="ml-3 block text-sm font-medium text-gray-700 dark:text-gray-300">
                                {{ option.label }}
                                <span class="block text-xs font-normal text-gray-500 dark:text-gray-400">{{ option.note }}</span>
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </fieldset>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ rule }}</p>
                <div class="flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-between gap-3">
                    <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
                    <button class="btn btn-primary" type="submit">Save Status</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
// Stopping work is deliberate: ask before suspending or archiving.
document.getElementById('lifecycle-form').addEventListener('submit', function (event) {
    var form = this;
    var chosen = form.querySelector('input[name="state"]:checked');
    if (form.dataset.confirmed === 'true' || !chosen || chosen.value === 'active' || chosen.value === {{ current_state|js|safe }}) return;
    event.preventDefault();
    var name = {{ subject|js|safe }};
    showConfirm(
        chosen.value === 'archived' ? 'Archive ' + name : 'Suspend ' + name,
        {{ confirm_note|js|safe }},
        function () { form.dataset.confirmed = 'true'; form.submit(); },
        { confirmText: chosen.value === 'archived' ? 'Archive' : 'Suspend', type: 'warning', destructive: true }
    );
});
</script>
{% endblock %}

# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# CI (.github/workflows/dependency-audit.yml) runs
#
#   cargo deny --locked check advisories sources
#
# on pull requests, on pushes to main and weekly, so an advisory published
# against an unchanged Cargo.lock still turns up. To run it locally, install
# cargo-deny and run the same command from the repository root.

[graph]
# Check every optional feature (gcs-storage, kata, local-embeddings, ...) and
# every target the release builds, not just the host's default graph.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# Vulnerability, unsound and notice advisories fail the check, as do
# unmaintained crates and yanked versions in Cargo.lock. Every ignore below
# names the advisory, the crates that pull it in, and why it can stay.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained. Only askama_derive uses it, at compile time, to read askama.toml; no askama release has replaced it yet." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained. It is a proc-macro (no runtime code) used by tokenizers, through fastembed's local embeddings; no tokenizers release has dropped it yet." },
    { id = "RUSTSEC-2023-0071", reason = "rsa before 0.10.0 (Marvin timing side channel) comes in through russh and ssh-key for hot.dev/ssh and hot.dev/sftp. rsa 0.10.0 fixes it, but russh 0.65.1, the latest release, pins rsa to =0.10.0-rc.18. Hot is only an SSH client: RSA host-key checks are public-key operations, and an RSA user key signs once per connection that the workflow starts to a pinned host. Hot never decrypts with RSA, which is the operation the Marvin attack targets. Dropping russh's rsa feature would rule out RSA host and user keys, which many SFTP servers still require. Remove this once russh allows rsa 0.10.0." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys bundles SQLite before 3.54.0, which can return uninitialized page-cache memory when it opens a database with a sibling -wal file of a different page size. The fix is libsqlite3-sys 0.39, but sqlx-sqlite 0.9.0, the latest release, requires <0.38 and the two must match. Hot's own databases are not written by less trusted parties. In service mode ::hot::sqlite copies only the database bytes to a server-named scratch file, so a caller cannot supply a -wal. In direct mode the exposure is an operator opening an untrusted database and -wal pair. Remove this once sqlx allows 0.39." },
]

[sources]
# Every dependency comes from crates.io: no other registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

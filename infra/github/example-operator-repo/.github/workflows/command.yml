name: command

on:
  workflow_dispatch:
    inputs:
      operation:
        description: backup, drain-and-stop, and roll-back are for single-machine installations
        type: choice
        options: [status, diagnostics, logs, backup, restart-service, drain-and-stop, roll-back, test-alert, deploy-now]
      service:
        description: For logs and restart-service; a scalable installation's hosts do not run postgres or valkey
        type: choice
        default: none
        options: [none, app, api, worker, task-worker, scheduler, ingress, postgres, valkey]

permissions:
  contents: read
  id-token: write

jobs:
  hot:
    uses: hot-dev/hot/.github/workflows/selfhost-command.yml@v3.0.2
    with:
      operation: ${{ inputs.operation }}
      service: ${{ inputs.service }}
      installation: hot-example
      cloud: aws
      hot_version: v3.0.2
      environment: production
      # The installation's preset, as in the infrastructure workflow: scalable
      # for a scalable installation. It decides which hosts a command waits for
      # and which commands are refused.
      preset: single-machine
      # The workflow waits 30 minutes for deploy-now, roll-back, and backup and
      # 15 for the rest. Set timeout_minutes if yours take longer, as a backup
      # of a large local database can.
      aws_region: us-east-1
      aws_release_role: arn:aws:iam::123456789012:role/hot-example-release
      # On Google Cloud, in place of `cloud: aws` and the aws_ lines, with values
      # from the state bootstrap's outputs. Scalable installations also need
      # `preset: scalable`, above, and gcp_zone, the installation's zone:
      #   cloud: gcp
      #   gcp_project: example-project
      #   gcp_workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/hot-github/providers/github
      #   gcp_release_service_account: hot-github-release@example-project.iam.gserviceaccount.com

[package]
name = "hot_lang"
version.workspace = true
edition.workspace = true
description = "The Hot language without its runtime: lexer, parser, AST, diagnostics, type checker and bytecode compiler"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
ahash = { workspace = true }
ariadne = { workspace = true }
base64 = { workspace = true }
croner = { workspace = true }
english-to-cron = { workspace = true }
fastnum = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
postcard = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Hashes the user name into the fallback temp cache dir where there is no uid.
[target.'cfg(not(unix))'.dependencies]
blake3 = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
tempfile = { workspace = true }

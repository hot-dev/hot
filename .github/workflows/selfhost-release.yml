name: selfhost-release

# Reusable: deploy a Hot release to a self-host installation. It verifies the
# release manifest's signature, writes the installation's release pointer,
# asks the host agent to deploy now, and waits for the agent's report. It uses
# only cloud control-plane APIs: no SSH, shell, or network access to the host.
# The pointer, command, and wait are infra/operator/selfhost.py, which
# operators can also run by hand.
#
#   uses: hot-dev/hot/.github/workflows/selfhost-release.yml@v3.0.1
on:
  workflow_call:
    inputs:
      release:
        description: Hot release to deploy, such as 3.0.1
        type: string
        required: true
      installation:
        description: Installation name
        type: string
        required: true
      cloud:
        type: string
        required: true
      environment:
        type: string
        default: production
      hot_version:
        description: Hot tag whose operator helper to use; empty means the release's own tag
        type: string
        default: ''
      manifest_base_url:
        description: Where manifests are published; empty means Hot's GitHub releases
        type: string
        default: ''
      signer_identity:
        description: Manifest signer identity regex; change only for a fork's releases
        type: string
        default: '^https://github\.com/hot-dev/hot/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
      timeout_minutes:
        type: number
        default: 30
      aws_region:
        type: string
        default: ''
      aws_release_role:
        type: string
        default: ''
      gcp_project:
        type: string
        default: ''
      gcp_workload_identity_provider:
        type: string
        default: ''
      gcp_release_service_account:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    name: Deploy ${{ inputs.release }} to ${{ inputs.installation }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: selfhost-release-${{ github.repository }}-${{ inputs.installation }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ inputs.release }}
      NAME: ${{ inputs.installation }}
      REQUEST_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check inputs
        env:
          CLOUD: ${{ inputs.cloud }}
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release must be a version"; exit 1; }
          [[ "$NAME" =~ ^[a-z][a-z0-9-]{2,23}$ ]] || { echo "::error::invalid installation name"; exit 1; }
          [[ "$CLOUD" =~ ^(aws|gcp)$ ]] || { echo "::error::cloud must be aws or gcp"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Verify the release manifest
        env:
          BASE: ${{ inputs.manifest_base_url }}
          SIGNER: ${{ inputs.signer_identity }}
        run: |
          set -euo pipefail
          base="${BASE:-https://github.com/hot-dev/hot/releases/download/v{release}}"
          base="${base//\{release\}/$RELEASE}"
          curl -fsSL -o manifest.json "$base/hot-selfhost-manifest.json"
          curl -fsSL -o manifest.sigstore.json "$base/hot-selfhost-manifest.sigstore.json"
          cosign verify-blob --bundle manifest.sigstore.json \
            --certificate-identity-regexp "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com manifest.json
          [[ "$(jq -r .release manifest.json)" == "$RELEASE" ]] || { echo "::error::manifest names another release"; exit 1; }
          jq . manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the operator helper
        uses: actions/checkout@v5
        with:
          repository: hot-dev/hot
          ref: ${{ inputs.hot_version || format('v{0}', inputs.release) }}
          path: hot
          sparse-checkout: infra/operator

      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_release_role }}
          aws-region: ${{ inputs.aws_region }}

      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_release_service_account }}

      - name: Release
        env:
          CLOUD: ${{ inputs.cloud }}
          REGION: ${{ inputs.aws_region }}
          PROJECT: ${{ inputs.gcp_project }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          jq -n '{installation: {name: env.NAME, cloud: env.CLOUD, region: env.REGION, project: env.PROJECT}}' > installation.json
          python3 hot/infra/operator/selfhost.py installation.json --request-id "$REQUEST_ID" \
            --timeout $(( TIMEOUT * 54 )) --summary "$GITHUB_STEP_SUMMARY" release "$RELEASE"

name: gcs-integration

# Real-bucket Google Cloud Storage contract tests, run by hand from the
# Actions tab rather than on every push or pull request. Emulators do not
# qualify IAM, compose, or generation-precondition semantics. Authenticates
# with Workload Identity Federation (no key files) and runs without AWS
# credentials. Needs the repository variables HOT_TEST_GCS_BUCKET,
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_TEST_SERVICE_ACCOUNT.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.99.1
  TAILWIND_VERSION: v4.3.3
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  SQLX_OFFLINE: 'true'
  CI: 'true'

jobs:
  gcs-integration:
    name: GCS Integration Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the test configuration
        env:
          BUCKET: ${{ vars.HOT_TEST_GCS_BUCKET }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set the repository variables HOT_TEST_GCS_BUCKET, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_TEST_SERVICE_ACCOUNT."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}

      - name: GCS storage contract tests
        env:
          HOT_TEST_GCS_BUCKET: ${{ vars.HOT_TEST_GCS_BUCKET }}
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
        run: >-
          cargo test -p hot --features gcs-storage --locked --lib --
          file_storage::tests::contract storage::tests::test_gcs

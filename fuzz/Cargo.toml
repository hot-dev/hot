# Fuzz targets for the Hot parser, checker and formatter. Run them with
# cargo-fuzz on a nightly toolchain, for example:
#   cargo +nightly fuzz run parse -- -max_total_time=300
# The nightly workflow runs every target. This crate is not a member of the
# main workspace, so it keeps its own (uncommitted) lockfile.
[package]
name = "hot-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hot = { path = "../crates/hot" }
tempfile = "3.27"

[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt"
path = "fuzz_targets/fmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

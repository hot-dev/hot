name: hot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # The default types leave out ready_for_review, so a pull request leaving
    # draft would keep the skipped jobs of its last draft push.
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Runs the required checks on merge-queue groups, if the main ruleset
  # enables a merge queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.100.0
  TAILWIND_VERSION: v4.3.5
  # Disable incremental in CI: it bloats target/ (which Swatinem/rust-cache
  # strips before saving anyway) and reduces sccache hit rates. CI does clean
  # builds against a shared cache, not the inner-loop edit pattern that
  # incremental is designed for.
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  SQLX_OFFLINE: 'true'
  # Pin GIT_SHA in non-release CI builds so sccache hits across commits that do
  # not touch a crate. `crates/hot` still invalidates AST/bytecode caches via
  # HOT_BUILD_FINGERPRINT; release.yml omits this and embeds the real SHA.
  HOT_GIT_SHA: '0000000000000000000000000000000000000000'
  CI: 'true'

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      kata: ${{ steps.filter.outputs.kata }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name == 'pull_request'

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "kata=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          # Run Kata check only when hot, hot_task_worker, Cargo manifests, or CI setup change.
          if grep -qE '^(crates/hot/|crates/hot_task_worker/|Cargo\.(toml|lock)$|\.github/(workflows/hot\.yml|actions/))' <<<"$changed"; then
            kata=true
          else
            kata=false
          fi
          # Skip full Rust tests only when every changed file is purely AI skills,
          # infra, release notes, top-level markdown, or standalone JS/doc-link checks.
          # Note: resources/docs/ still triggers Rust tests (cli_docs.rs, conf_docs.rs).
          if grep -qvE '^(resources/ai/|infra/|scripts/(check-ai|check-agents|check-doc-links|test-check-doc-links|check-demo-doc-pins|test-check-demo-doc-pins|check-actions-pinned|browser-security|check-sdk-doc-pins|test-app-scope)|\.github/release-notes/|README\.md$|CONTRIBUTING\.md$|CHANGELOG\.md$)' <<<"$changed"; then
            rust=true
          else
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "kata=$kata" >> "$GITHUB_OUTPUT"
          echo "Detected changes -> rust=$rust, kata=$kata"

  browser-security:
    name: Browser Security Regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: node --test scripts/browser-security.test.mjs
        env:
          CHROME_BIN: google-chrome
      # Parses the SDK page's version pins; the registry lookup itself runs
      # nightly and in the release workflow.
      - run: node --test scripts/check-sdk-doc-pins.test.mjs

  clippy-and-checks:
    name: Clippy and Static Checks
    runs-on:
      group: hot-ci
      labels: ubuntu-24.04-8core
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: "false"
          cache-rust-targets: "false"
          ci-tuning: "true"
          cargo-build-jobs: '8'

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Versions are in sync
        run: ./scripts/check-version-sync.sh

      - name: Package pins match the repo versions
        run: python3 scripts/check-pkg-pins.py

      # The docs' internal links, anchors and navigation; and what the demo
      # pages say about hot-demos, against scripts/demo-doc-pins.json (the
      # nightly workflow checks that file against hot-demos itself). The CLI
      # and configuration references are checked by Rust tests in hot_cli
      # (cli_docs.rs, conf_docs.rs), and the docs' ```hot blocks by the Hot
      # static checks below.
      - name: Docs links, anchors and demo pins
        run: |
          python3 scripts/test-check-doc-links.py
          python3 scripts/check-doc-links.py
          python3 scripts/test-check-demo-doc-pins.py
          python3 scripts/check-demo-doc-pins.py

      # Unit tests for the self-host bundle renderer. The container checks
      # skip here; the nightly workflow runs them against real images. The
      # workflow tests run here because the release workflow's green-CI gate
      # reads only this workflow, so a version bump pushed straight to main
      # must still fail while the example callers pin the old release.
      - name: Self-host bundle tests
        run: |
          python3 scripts/run-unittest-parallel.py -s infra/tests
          python3 -m unittest discover -s infra/github/tests

      - name: Archive installer regressions
        run: |
          python3 scripts/test-install-archive.py
          sudo python3 scripts/test-install-archive.py ArchiveInstallTests.test_extracted_files_belong_to_installer

      # Clippy intentionally uses the workspace default feature set. Keeping it
      # aligned with the workspace test feature set avoids forcing cargo to
      # rebuild the full dependency graph between the two jobs once caches warm.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Browser scope contract
        run: node --test scripts/test-app-scope.mjs

      - name: Verify AGENTS.md sync
        run: bash ./scripts/check-agents-sync.sh

      # Checks the skills against the manifest hashes only. The comparison with
      # the hot-skills repository runs in the ai-skills-mirror workflow, so a
      # merge there can't fail this one.
      - name: Verify AI skill assets sync
        run: bash ./scripts/check-ai-assets-sync.sh

      # Build `hot` once and export HOT_BIN so Hot static checks, doc block
      # checks, and real-pin smoke checks invoke the binary directly.
      - name: Build hot binary
        run: |
          cargo build --locked --bin hot
          echo "HOT_BIN=$GITHUB_WORKSPACE/target/debug/hot" >> "$GITHUB_ENV"

      # `hot-static-checks.sh check` runs the default project check, the package
      # aggregate check, `hot fmt --check` over all Hot source, validates
      # {{snippet:...}} references, compiles bundled Hot-language skill
      # examples/tests, and checks the ```hot blocks in the AI docs and in
      # resources/docs.
      - name: Hot static checks
        run: ./scripts/hot-static-checks.sh check

      # The projects above load packages by local path, which replaces the
      # versions packages pin. On pull requests the real-pin smoke test runs
      # only when a package or hot-std's native functions change, since that
      # is what can break a pin.
      - name: Check whether packages or hot-std changed
        id: pkg-changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -qE '^(hot/pkg/|crates/hot/src/lang/hot/|scripts/check-pkg-pins\.py$|\.github/workflows/hot\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit 2 means only pkg.hot.dev downloads failed.
      - name: Packages compile with their real pins
        if: github.event_name != 'pull_request' || steps.pkg-changes.outputs.run == 'true'
        run: |
          status=0
          python3 scripts/check-pkg-pins.py smoke || status=$?
          if [[ $status -eq 2 ]]; then
            echo "::error::Downloads from pkg.hot.dev failed, so some pins weren't checked. This is not a code failure; rerun the job."
          fi
          exit "$status"

      - name: sccache stats
        run: sccache --show-stats || true

  rust-tests:
    name: Rust Tests
    needs: [changes]
    runs-on:
      group: hot-ci
      labels: ubuntu-24.04-8core
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.rust == 'true'
    services:
      postgres:
        # PostgreSQL 18.6 with pgvector 0.8.7. The digest pins both: the
        # pgvector tags are rebuilt for each new PostgreSQL minor.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: hot
          POSTGRES_PASSWORD: hot
          POSTGRES_DB: hot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hot -d hot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          # Single writer of the shared Linux sccache and crates.io registry cache
          # on main: rust-tests compiles the full workspace superset, avoiding four
          # duplicate ~1 GB caches against the 10 GB repository quota.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-rust-targets: "false"
          ci-tuning: "true"
          cargo-build-jobs: '8'

      - name: Install psql for upgrade provisioning tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest

      # Cargo runs crate tests outside the workspace root. Expose checkout
      # assets through executable-relative discovery without changing the
      # default database/profile behavior via HOT_HOME.
      - name: Prepare checkout runtime for Rust tests
        run: |
          runtime_assets="$RUNNER_TEMP/hot-rust-test-resources"
          mkdir -p "$runtime_assets" target/debug/deps
          for entry in "$GITHUB_WORKSPACE/resources/"*; do
            ln -s "$entry" "$runtime_assets/${entry##*/}"
          done
          ln -s "$GITHUB_WORKSPACE/hot/pkg" "$runtime_assets/pkg"
          for destination in target/debug/resources target/debug/deps/resources; do
            if [[ -L "$destination" ]]; then
              rm "$destination"
            fi
            ln -s "$runtime_assets" "$destination"
          done

      - name: Run Rust tests
        env:
          REDIS_URL: redis://localhost:6379
          HOT_TEST_POSTGRES_URI: postgres://hot:hot@localhost:5432/hot
          HOT_TEST_POSTGRES_RESET_SCHEMA: '1'
        run: cargo nextest run --workspace --all-targets --locked --profile ci

      - name: sccache stats
        run: sccache --show-stats || true

  hot-tests:
    name: Hot Tests
    runs-on:
      group: hot-ci
      labels: ubuntu-24.04-8core
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        # PostgreSQL 18.6 with pgvector 0.8.7. The digest pins both: the
        # pgvector tags are rebuilt for each new PostgreSQL minor.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: hot
          POSTGRES_PASSWORD: hot
          POSTGRES_DB: hot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hot -d hot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: "false"
          cache-rust-targets: "false"
          ci-tuning: "true"
          cargo-build-jobs: '8'

      - name: Build hot binary
        run: cargo build --locked --bin hot

      - name: Run Hot init
        run: ./target/debug/hot init -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Hot tests
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
        run: ./target/debug/hot test -c hot.test.hot --ctx hot/ci.ctx.hot

      # The same suite with every function JIT-compiled on its first call.
      # At the default threshold most test code never reaches the JIT, so a
      # compiled result that differs from the interpreter's would go unseen.
      - name: Run Hot tests (JIT threshold 1)
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
        run: ./target/debug/hot test -c hot.test.hot --ctx hot/ci.ctx.hot --jit.threshold 1

      - name: Provision restricted PostgreSQL runtime
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U hot -d hot -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hot_runtime LOGIN PASSWORD 'hot_runtime' NOSUPERUSER NOBYPASSRLS NOINHERIT NOCREATEDB NOCREATEROLE"
          ./target/debug/hot db migrate -c hot.test.hot --ctx hot/ci.ctx.hot \
            --db.migration-uri=postgres://hot:hot@localhost:5432/hot
          docker exec -i "${{ job.services.postgres.id }}" psql -U hot -d hot \
            -v runtime_role=hot_runtime -v schema=hot < resources/db/postgres/provision_runtime.sql

      - name: Run Hot init (full suite, Postgres + Redis)
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: ./target/debug/hot init -c hot.test.hot --ctx hot/ci.ctx.hot --db.migration-uri=postgres://hot:hot@localhost:5432/hot

      - name: Run Hot tests (full suite, Postgres + Redis)
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: ./target/debug/hot test -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Postgres queue smoke init
        env:
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: ./target/debug/hot init -c pg.redis.test.hot --ctx hot/ci.ctx.hot --profile local-dev --db.migration-uri=postgres://hot:hot@localhost:5432/hot

      - name: Run Postgres queue smoke tests
        env:
          HOT_TEST_VAR: "set so that :hot.env/vars() is not empty"
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: ./target/debug/hot test -c pg.redis.test.hot --ctx hot/ci.ctx.hot --profile local-dev

      - name: Run Hot Box tests (Docker integration)
        env:
          HOT_BOX_ENABLED: true
        run: ./target/debug/hot test box -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: Run Hot Box tests (full suite, Postgres + Redis)
        env:
          HOT_BOX_ENABLED: true
          HOT_TEST_POSTGRES_URI: postgres://hot_runtime:hot_runtime@localhost:5432/hot
          HOT_TEST_FILE_STORAGE_PATH: ./.hot/pg-full/file
          HOT_REDIS_URI: redis://localhost:6379
          HOT_QUEUE_TYPE: redis
        run: ./target/debug/hot test box -c hot.test.hot --ctx hot/ci.ctx.hot

      - name: sccache stats
        run: sccache --show-stats || true

  kata-check:
    name: Kata Backend Compile Check
    needs: [changes]
    runs-on:
      group: hot-ci
      labels: ubuntu-24.04-8core
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.kata == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free disk space when low
        uses: ./.github/actions/free-disk-space

      - name: Setup toolchain, cache, sccache, tailwind
        uses: ./.github/actions/rust-setup
        with:
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          tailwind-version: ${{ env.TAILWIND_VERSION }}
          save-cache: "false"
          cache-rust-targets: "false"
          ci-tuning: "true"
          cargo-build-jobs: '8'

      - name: Install protobuf compiler (for containerd-client)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `cargo check --all-targets --features kata` type-checks lib, bin, and
      # test code under the Linux-only kata feature without codegen or linking.
      - name: Compile Kata backend (Linux feature check)
        run: cargo check -p hot_task_worker --all-targets --features kata --locked

      - name: sccache stats
        run: sccache --show-stats || true

  lint-and-test:
    # main requires this check by name. The name comes from a matrix so that a
    # skipped run reports under the unexpanded expression instead: a head last
    # pushed as a draft then has no skipped gate to merge on while its tests
    # run. Keep the value equal to the required check in the ruleset.
    name: ${{ matrix.required-check }}
    strategy:
      matrix:
        required-check: [ 'Lint, Rust Tests, and Hot Tests' ]
    runs-on: ubuntu-24.04
    needs: [changes, browser-security, clippy-and-checks, rust-tests, hot-tests, kata-check]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check split job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_RUST: ${{ needs.changes.outputs.rust }}
          RUN_KATA: ${{ needs.changes.outputs.kata }}
          BROWSER_SECURITY_RESULT: ${{ needs.browser-security.result }}
          CLIPPY_RESULT: ${{ needs.clippy-and-checks.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          HOT_TESTS_RESULT: ${{ needs.hot-tests.result }}
          KATA_CHECK_RESULT: ${{ needs.kata-check.result }}
        run: |
          failed=0
          for result in \
            "$CHANGES_RESULT" \
            "$BROWSER_SECURITY_RESULT" \
            "$CLIPPY_RESULT" \
            "$HOT_TESTS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$RUST_TESTS_RESULT" != "success" && ! ( "$RUN_RUST" == "false" && "$RUST_TESTS_RESULT" == "skipped" ) ]]; then
            failed=1
          fi
          if [[ "$KATA_CHECK_RESULT" != "success" && ! ( "$RUN_KATA" == "false" && "$KATA_CHECK_RESULT" == "skipped" ) ]]; then
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more split CI jobs failed."
            exit 1
          fi

          echo "All split CI jobs passed."

  # build:
  #   name: Build
  #   needs: [lint-and-test]
  #   runs-on: ubuntu-24.04
  #   if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
  #   steps:
  #     - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

  #     - name: Setup toolchain, cache, sccache, tailwind
  #       uses: ./.github/actions/rust-setup
  #       with:
  #         rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
  #         tailwind-version: ${{ env.TAILWIND_VERSION }}

  #     - name: Build
  #       run: cargo build --release --workspace --locked

  #     - name: sccache stats
  #       run: sccache --show-stats || true

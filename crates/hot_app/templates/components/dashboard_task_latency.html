<!-- Task waiting/execution is scoped by the current environment and shared dashboard filters. -->
<div class="relative min-w-0 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
    <div class="flex items-start justify-between gap-3">
        <div>
            <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">Task Waiting vs. Execution</h4>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5"
               title="Waiting is measured from durable task creation to workload start. Execution is measured from workload start to task completion. Queued and in-progress tasks are excluded.">
                Persisted task → workload start → completion; completed tasks only.
            </p>
        </div>
        <button onclick="openFullscreen('taskLatencyTimelineChart', 'Task Waiting vs. Execution')"
                class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors"
                title="View fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                <path fill-rule="evenodd" d="M15 3.75a.75.75 0 01.75-.75h4.5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0V5.56l-3.97 3.97a.75.75 0 11-1.06-1.06l3.97-3.97h-2.69a.75.75 0 01-.75-.75zm-12 0A.75.75 0 013.75 3h4.5a.75.75 0 010 1.5H5.56l3.97 3.97a.75.75 0 01-1.06 1.06L4.5 5.56v2.69a.75.75 0 01-1.5 0v-4.5zm11.47 11.78a.75.75 0 111.06-1.06l3.97 3.97v-2.69a.75.75 0 011.5 0v4.5a.75.75 0 01-.75.75h-4.5a.75.75 0 010-1.5h2.69l-3.97-3.97zm-4.94-1.06a.75.75 0 010 1.06L5.56 19.5h2.69a.75.75 0 010 1.5h-4.5a.75.75 0 01-.75-.75v-4.5a.75.75 0 011.5 0v2.69l3.97-3.97a.75.75 0 011.06 0z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mt-4">
        <div>
            <div class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Waiting p50</div>
            <div id="task-latency-wait-p50" class="text-lg font-semibold text-amber-600 dark:text-amber-400">—</div>
        </div>
        <div>
            <div class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Execution p50</div>
            <div id="task-latency-exec-p50" class="text-lg font-semibold text-green-600 dark:text-green-400">—</div>
        </div>
        <div>
            <div class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Waiting p95</div>
            <div id="task-latency-wait-p95" class="text-lg font-semibold text-amber-600 dark:text-amber-400">—</div>
        </div>
        <div>
            <div class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Execution p95</div>
            <div id="task-latency-exec-p95" class="text-lg font-semibold text-green-600 dark:text-green-400">—</div>
        </div>
        <div>
            <div class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Samples</div>
            <div id="task-latency-samples" class="text-lg font-semibold text-gray-800 dark:text-gray-200">—</div>
            <div id="task-latency-coverage" class="text-[11px] text-gray-500 dark:text-gray-400" title="Share of samples using direct creation, workload-start, and completion timestamps instead of legacy fallbacks">Precision coverage</div>
        </div>
    </div>

    <div class="flex items-center justify-between mt-4 mb-1">
        <span class="text-xs text-gray-500 dark:text-gray-400" title="The headline tiles remain fixed at their labeled p50 and p95 values">Chart percentile</span>
        <div class="inline-flex rounded-md border border-gray-200 dark:border-gray-700 p-0.5" role="group" aria-label="Task latency percentile">
            <button id="task-latency-p50-button" aria-pressed="false" onclick="setLatencyPercentile('task', 'p50')" class="latency-percentile-button px-2 py-0.5 rounded text-xs text-gray-500 dark:text-gray-400">p50</button>
            <button id="task-latency-p95-button" aria-pressed="true" onclick="setLatencyPercentile('task', 'p95')" class="latency-percentile-button px-2 py-0.5 rounded text-xs bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white font-medium">p95</button>
            <button id="task-latency-p99-button" aria-pressed="false" onclick="setLatencyPercentile('task', 'p99')" class="latency-percentile-button px-2 py-0.5 rounded text-xs text-gray-500 dark:text-gray-400">p99</button>
        </div>
    </div>
    <div class="relative" style="height: 260px;">
        <div id="taskLatencyTimelineChart" class="w-full h-full"></div>
        {% include "components/dashboard_chart_skeleton.html" %}
    </div>
</div>
